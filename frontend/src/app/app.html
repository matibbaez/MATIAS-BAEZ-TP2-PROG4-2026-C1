<main class="min-h-screen bg-gray-950 text-gray-100 font-sans selection:bg-blue-500 selection:text-white">
  @if (authService.verificandoSesion()) {
    <div class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gray-950">
      <div class="relative flex items-center justify-center">
        <div class="h-16 w-16 animate-spin rounded-full border-4 border-blue-500/20 border-t-blue-500"></div>
        <div class="absolute h-3 w-3 rounded-full bg-blue-500 shadow-lg shadow-blue-500/50"></div>
      </div>
      <p class="mt-5 animate-pulse text-sm font-semibold tracking-widest text-gray-400 uppercase">
        Verificando credenciales...
      </p>
    </div>
  } @else {
    <router-outlet />
  }
</main>
