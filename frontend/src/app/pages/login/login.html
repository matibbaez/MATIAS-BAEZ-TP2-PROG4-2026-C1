<div class="min-h-screen flex items-center justify-center p-4 md:p-6 bg-gray-950 font-sans select-none">
  <div class="max-w-md w-full bg-gray-900 rounded-[2.5rem] p-8 md:p-10 border border-gray-800 shadow-2xl relative overflow-hidden">
    
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-2 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-40"></div>

    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-white tracking-tight">Iniciar Sesión</h1>
      <p class="text-xs text-gray-400 mt-1">Acceso a la plataforma académica</p>
    </div>

    <div *ngIf="mensajeError" class="mb-6 p-4 bg-red-950/40 border border-red-800/80 rounded-2xl text-red-300 text-xs font-medium flex items-center gap-3">
      <svg class="w-5 h-5 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span>{{ mensajeError }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Usuario o Correo Institucional</label>
        <input type="text" formControlName="loginInput" placeholder="matiasbaez o usuario@utn.edu.ar"
               class="w-full bg-gray-950 border rounded-xl px-4 py-3 text-gray-100 text-sm focus:outline-none transition-colors"
               [ngClass]="loginForm.get('loginInput')?.invalid && loginForm.get('loginInput')?.touched ? 'border-red-500/80 focus:border-red-500' : 'border-gray-800 focus:border-blue-500'">
        <span *ngIf="loginForm.get('loginInput')?.invalid && loginForm.get('loginInput')?.touched" class="text-[11px] text-red-400 mt-1 block font-medium">Ingresá tu identificador</span>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400">Contraseña de Seguridad</label>
        </div>
        <input type="password" formControlName="contrasena" placeholder="••••••••"
               class="w-full bg-gray-950 border rounded-xl px-4 py-3 text-gray-100 text-sm focus:outline-none transition-colors tracking-widest"
               [ngClass]="loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched ? 'border-red-500/80 focus:border-red-500' : 'border-gray-800 focus:border-blue-500'">
        <span *ngIf="loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched" class="text-[11px] text-red-400 mt-1 block font-medium">La clave es obligatoria</span>
      </div>

      <button type="submit" [disabled]="cargando" 
              class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.99] disabled:opacity-50 text-white font-black py-4 rounded-xl shadow-lg hover:shadow-blue-500/20 transition-all uppercase tracking-widest text-xs flex items-center justify-center gap-2 cursor-pointer mt-2">
        <svg *ngIf="cargando" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
        </svg>
        <span>{{ cargando ? 'Verificando hash...' : 'Ingresar al Sistema' }}</span>
      </button>

    </form>

    <div class="mt-8 text-center border-t border-gray-800/80 pt-6">
      <p class="text-xs text-gray-400">
        ¿Aún no posees credenciales? 
        <a routerLink="/registro" class="text-blue-400 font-bold hover:text-blue-300 transition-colors ml-1">Solicitar alta de cuenta</a>
      </p>
    </div>

  </div>
</div>
