<app-navbar />

<div class="min-h-[100dvh] bg-gray-950 pt-20 pb-24 md:pb-12 px-4 flex flex-col items-center select-none">
  <div class="max-w-xl w-full space-y-6">

    <div *ngIf="mensajeError" class="p-4 bg-red-950/40 border border-red-800/80 rounded-2xl text-red-300 text-xs font-medium flex items-center gap-3 animate-fade-in">
      <svg class="w-5 h-5 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span>{{ mensajeError }}</span>
    </div>
    
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 shadow-xl relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-0.5 bg-gradient-to-r from-blue-600/30 via-blue-500/50 to-blue-600/30"></div>
      
      <div class="flex gap-3.5 mb-3">
        <img *ngIf="usuarioLogueado" [src]="usuarioLogueado.imagenPerfil || 'https://api.dicebear.com/7.x/initials/svg?seed=' + usuarioLogueado.nombre" 
             class="w-10 h-10 rounded-full object-cover border border-gray-800 shrink-0 shadow-inner">
        
        <div class="flex-1 min-w-0 space-y-2">
          
          <div>
            <input type="text" [(ngModel)]="nuevoTitulo" maxlength="60" placeholder="Título de tu investigación..."
                   class="w-full bg-transparent text-blue-400 font-black text-base focus:outline-none placeholder-blue-950 border-b border-gray-800/80 pb-1"
                   [disabled]="publicando">
            <div class="text-[10px] text-gray-500 font-mono text-right mt-0.5 font-bold">
              <span>{{ nuevoTitulo?.length || 0 }} / 60</span>
            </div>
          </div>

          <div>
            <textarea [(ngModel)]="nuevaDescripcion" rows="2" maxlength="280"
                      placeholder="Desarrollá tu idea académica acá, {{ usuarioLogueado?.nombre }}..."
                      class="w-full bg-transparent text-gray-200 text-xs md:text-sm focus:outline-none resize-none placeholder-gray-600 leading-relaxed"
                      [disabled]="publicando"></textarea>
            <div class="text-[10px] text-gray-500 font-mono text-right mt-0.5 font-bold">
              <span>{{ nuevaDescripcion?.length || 0 }} / 280</span>
            </div>
          </div>

        </div>
      </div>

      <div *ngIf="previewUrl" class="mb-3 relative rounded-2xl overflow-hidden border border-gray-800 bg-black/50 max-h-48 flex items-center justify-center">
        <img [src]="previewUrl" class="max-h-48 w-full object-cover">
        <button (click)="previewUrl = null; archivoSeleccionado = null" title="Quitar imagen adjunta" 
                class="absolute top-2 right-2 bg-gray-900/80 text-gray-300 hover:text-white p-1.5 rounded-full hover:bg-red-600/80 transition-all cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="flex items-center justify-between border-t border-gray-800/80 pt-3">
        
        <label class="flex items-center gap-1.5 text-xs text-gray-400 hover:text-blue-400 bg-gray-950/60 hover:bg-gray-800/50 px-3 py-1.5 rounded-xl border border-gray-800 transition-all cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span>{{ archivoSeleccionado ? 'Cambiar foto' : 'Adjuntar imagen' }}</span>
          <input type="file" (change)="seleccionarImagen($event)" accept="image/*" class="hidden">
        </label>

        <button (click)="realizarPosteo()" 
                [disabled]="publicando || !nuevoTitulo.trim() || !nuevaDescripcion.trim()"
                class="bg-blue-600 hover:bg-blue-500 disabled:opacity-30 text-white text-xs font-black px-5 py-2 rounded-xl transition-all cursor-pointer shadow-lg shadow-blue-600/20 flex items-center gap-1.5">
          <span>{{ publicando ? 'Guardando...' : 'Publicar' }}</span>
        </button>

      </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-3 bg-gray-900/60 border border-gray-800/80 px-4 py-2.5 rounded-2xl text-xs">
      
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h9m5-4v12m0 0l-4-4m4 4l4-4"/>
        </svg>
        <span class="text-gray-400 font-bold">Ordenar por:</span>
        <select [(ngModel)]="ordenActual" (change)="alCambiarOrden()" class="bg-gray-950 text-blue-400 font-black border border-gray-800 rounded-xl px-3 py-1.5 focus:outline-none focus:border-blue-500 cursor-pointer">
          <option value="fecha">Más recientes</option>
          <option value="likes">Mayor relevancia (Me Gusta)</option>
        </select>
      </div>

      <div class="flex items-center gap-1.5">
        <button (click)="paginaAnterior()" [disabled]="paginaActual === 0 || cargandoFeed" 
                class="flex items-center gap-1 px-3 py-1.5 bg-gray-950 hover:bg-gray-800 disabled:opacity-30 text-gray-300 rounded-xl border border-gray-800 font-bold transition-all cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
          </svg>
          <span>Anterior</span>
        </button>
        
        <span class="text-gray-400 font-mono font-bold px-1.5">Pág. {{ paginaActual + 1 }}</span>
        
        <button (click)="paginaSiguiente()" [disabled]="feed.length < limit || cargandoFeed" 
                class="flex items-center gap-1 px-3 py-1.5 bg-gray-950 hover:bg-gray-800 disabled:opacity-30 text-gray-300 rounded-xl border border-gray-800 font-bold transition-all cursor-pointer">
          <span>Siguiente</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

    </div>

    <div *ngIf="cargandoFeed" class="text-center py-12 space-y-3">
      <div class="w-7 h-7 border-2 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mx-auto"></div>
      <p class="text-xs font-mono text-gray-500 tracking-wider uppercase">Obteniendo documentos...</p>
    </div>

    <div *ngIf="!cargandoFeed" class="space-y-4">
      
      <div *ngIf="feed.length === 0" class="bg-gray-900/40 border border-gray-800/80 p-10 rounded-3xl text-center">
        <h4 class="text-sm font-bold text-gray-300">No se encontraron publicaciones</h4>
        <p class="text-xs text-gray-500 mt-1">La base de datos no devolvió documentos para esta página.</p>
      </div>

      <div *ngFor="let post of feed">
        <app-publicacion-card 
          [post]="post"
          [miUsuarioId]="usuarioLogueado?._id || ''"
          [miRol]="usuarioLogueado?.perfil || 'usuario'"
          (toggleLike)="onToggleLike($event)"
          (eliminar)="onEliminarPost($event)"
        ></app-publicacion-card>
      </div>

    </div>

  </div>
</div>
