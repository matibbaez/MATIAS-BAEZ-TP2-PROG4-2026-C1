<header class="bg-gray-900/95 backdrop-blur-md border-b border-gray-800 px-4 md:px-6 py-3 flex items-center justify-between select-none fixed top-0 left-0 right-0 z-50 shadow-xl">
  
  <div class="flex items-center gap-2.5">
    <div class="w-7 h-7 md:w-8 md:h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black text-[11px] md:text-xs tracking-tighter shadow-lg shadow-blue-500/20">
      UTN
    </div>
    <div class="flex flex-col">
      <span class="font-black text-white tracking-wider text-[11px] md:text-xs leading-none">PLATAFORMA</span>
      <span class="text-[8px] md:text-[9px] text-blue-400 font-bold mt-0.5">RED SOCIAL</span>
    </div>
  </div>

  <nav class="hidden md:flex items-center gap-1 bg-gray-950 p-1 rounded-xl border border-gray-800/80">
    <a routerLink="/publicaciones" routerLinkActive="bg-gray-800 text-white font-bold shadow" 
       class="px-4 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-gray-200 transition-all cursor-pointer">
      Publicaciones
    </a>
    <a routerLink="/mi-perfil" routerLinkActive="bg-gray-800 text-white font-bold shadow" 
       class="px-4 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-gray-200 transition-all cursor-pointer">
      Mi Perfil
    </a>
  </nav>

  <div class="flex items-center gap-3">
    
    <div class="hidden sm:flex items-center gap-2 bg-gray-950/60 pl-2 pr-3 py-1 rounded-full border border-gray-800" *ngIf="usuario">
      <img [src]="usuario.imagenPerfil" class="w-5 h-5 rounded-full object-cover border border-gray-700">
      <span class="text-xs font-bold text-gray-200 tracking-tight">{{ usuario.nombre }}</span>
    </div>

    <button (click)="abrirModal()" title="Cerrar Sesión"
            class="p-2 text-gray-400 hover:text-red-400 hover:bg-red-950/40 rounded-xl transition-all cursor-pointer border border-transparent hover:border-red-800/50 flex items-center gap-1.5">
      <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span class="text-xs font-bold text-red-400 hidden md:inline">Salir</span>
    </button>

  </div>
</header>

<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-lg border-t border-gray-800/80 px-6 py-2 flex items-center justify-around z-50 shadow-2xl">
  <a routerLink="/publicaciones" routerLinkActive="text-blue-500 font-bold" 
     class="flex flex-col items-center gap-1 py-1 px-4 rounded-xl text-gray-400 hover:text-gray-200 transition-all">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
    </svg>
    <span class="text-[10px] tracking-tight">Publicaciones</span>
  </a>

  <a routerLink="/mi-perfil" routerLinkActive="text-blue-500 font-bold" 
     class="flex flex-col items-center gap-1 py-1 px-4 rounded-xl text-gray-400 hover:text-gray-200 transition-all">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    <span class="text-[10px] tracking-tight">Mi Perfil</span>
  </a>
</nav>

<div *ngIf="mostrarModalLogout" 
     class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 select-none animate-fade-in">
  
  <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-xs sm:max-w-sm w-full p-6 text-center shadow-2xl relative overflow-hidden">
    
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-transparent via-red-500 to-transparent opacity-50"></div>

    <div class="w-12 h-12 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center justify-center text-red-500 mx-auto mb-4 shadow-inner">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>

    <h3 class="text-base sm:text-lg font-black text-white tracking-tight mb-1">¿Cerrar Sesión?</h3>
    <p class="text-xs text-gray-400 leading-relaxed px-2 mb-6">
      Se destruirá el token de cifrado local. Deberás volver a ingresar tus credenciales para acceder al muro.
    </p>

    <div class="flex items-center gap-3">
      <button (click)="cancelar()" 
              class="flex-1 bg-gray-800 hover:bg-gray-700 active:scale-[0.98] text-gray-300 font-bold py-3 px-4 rounded-xl transition-all text-xs cursor-pointer">
        Cancelar
      </button>

      <button (click)="confirmarLogout()" 
              class="flex-1 bg-red-600 hover:bg-red-500 active:scale-[0.98] text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-red-600/20 text-xs cursor-pointer">
        Sí, salir
      </button>
    </div>

  </div>
</div>
